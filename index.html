<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perbandingan VLL & Pendapatan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS CDN untuk Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-white p-6 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Evaluasi & Perbandingan VLL & Pendapatan</h1>
                <p class="text-slate-500 text-sm">Analisis Proyeksi vs Realisasi Volume Lalu Lintas (VLL) dan Pendapatan</p>
            </div>
            <div class="flex gap-2">
                <button onclick="resetToDefaultData()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2.5 rounded-lg text-sm font-semibold transition duration-200">
                    Hapus Semua Data
                </button>
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold flex items-center gap-2 transition duration-200 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    Download Excel
                </button>
            </div>
        </div>

        <!-- Form Input Data -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 id="formTitle" class="text-lg font-semibold text-slate-800">Input Data Evaluasi VLL</h2>
                <button id="cancelEditBtn" onclick="resetForm()" class="hidden text-xs text-rose-600 hover:underline font-semibold">
                    ✕ Batal Edit
                </button>
            </div>
            <form id="evalForm" onsubmit="saveData(event)" class="grid grid-cols-1 md:grid-cols-6 gap-4">
                <input type="hidden" id="editId" value="">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Periode / Bulan</label>
                    <input type="text" id="inputPeriode" placeholder="Contoh: Januari" required class="w-full px-3 py-2 border rounded-lg text-sm  bg-slate-100 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Hari</label>
                    <input type="number" id="inputHari" placeholder="0" min="0" required class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-100 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Proyeksi VLL (RA)</label>
                    <input type="number" id="projVll" placeholder="0" min="0" required class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Proyeksi Pendapatan (RA)</label>
                    <input type="number" id="projRev" placeholder="0" min="0" required class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Realisasi VLL (RI)</label>
                    <input type="number" id="realVll" placeholder="0" min="0" required class="w-full px-3 py-2 border rounded-lg text-sm bg-blue-200 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Realisasi Pendapatan (RI)</label>
                    <input type="number" id="realRev" placeholder="0" min="0" required class="w-full px-3 py-2 border rounded-lg text-sm bg-blue-200 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex items-end">
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition duration-200">
                        + Tambah Data
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabel Perbandingan VLL & Pendapatan -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-800 text-slate-100 uppercase text-xs">
                        <tr>
                            <th rowspan="2" class="py-3 px-4 text-center border-r border-slate-700">Periode</th>
                            <th rowspan="2" class="py-3 px-4 text-center border-r border-slate-700">Hari</th>
                            <th colspan="5" class="py-2 px-4 text-center border-b border-r border-slate-700 bg-slate-800">Volume Lalu Lintas (VLL)</th>
                            <th colspan="4" class="py-2 px-4 text-center border-b border-r border-slate-700 bg-slate-800">Pendapatan (Rp)</th>
                            <th rowspan="2" class="py-3 px-4 text-center border-l border-slate-700">Aksi</th>
                        </tr>
                        <tr>
                            <!-- VLL Sub-header -->
                            <th class="py-2 px-3 text-center">VLL (RA)</th>
                            <th class="py-2 px-3 text-center">LHR (RA)</th>
                            <th class="py-2 px-3 text-center">VLL (RI)</th>
                            <th class="py-2 px-3 text-center">LHR (RI)</th>
                            <th class="py-2 px-3 text-center border-r border-slate-700">% Capai</th>
                            <!-- Pendapatan Sub-header -->
                            <th class="py-2 px-3 text-center">Proyeksi</th>
                            <th class="py-2 px-3 text-center">Realisasi</th>
                            <th class="py-2 px-3 text-center">Deviasi</th>
                            <th class="py-2 px-3 text-center">% Capai</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200">
                        <!-- Data dikalkulasi via Javascript -->
                    </tbody>
                    <tfoot class="bg-slate-100 font-bold text-slate-800 border-t-2 border-slate-300">
                        <tr id="tableFoot">
                            <!-- Summary dikalkulasi otomatis -->
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

    </div>

    <!-- SDK FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // ----------------------------------------------------
        // 1. KONFIGURASI FIREBASE
        // Pastikan mengganti data di bawah ini dengan config Firebase Anda!
        // ----------------------------------------------------
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const dbRef = database.ref('eval_vll_pendapatan');

        let dataReport = [];

        // ----------------------------------------------------
        // 2. LISTEN DATA REALTIME DARI FIREBASE
        // ----------------------------------------------------
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            dataReport = [];
            
            if (data) {
                // Mengubah objek Firebase menjadi Array
                Object.keys(data).forEach(key => {
                    dataReport.push({
                        id: key, ...data[key]
                    });
                });
            }
            renderTable();
        });

        function formatNum(nilai) {
            return Number(nilai).toLocaleString("id-ID", {minimumFractionDigits: 0, maximumFractionDigits: 0});
        }

        function formatCurrency(num) {
            return 'Rp ' + new Intl.NumberFormat('id-ID').format(num);
        }

        // ----------------------------------------------------
        // 3. TAMBAH / EDIT DATA KE FIREBASE
        // ----------------------------------------------------
        function saveData(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            
            const payload = {
                periode: document.getElementById('inputPeriode').value,
                hari: parseInt(document.getElementById('inputHari').value) || 0,
                projVll: parseInt(document.getElementById('projVll').value) || 0,
                realVll: parseInt(document.getElementById('realVll').value) || 0,
                projRev: parseInt(document.getElementById('projRev').value) || 0,
                realRev: parseInt(document.getElementById('realRev').value) || 0
            };

            if (editId) {
                // Update data di Firebase berdasarkan ID (Key)
                database.ref('eval_vll_pendapatan/' + editId).update(payload)
                    .then(() => resetForm())
                    .catch(err => alert("Gagal update data: " + err.message));
            } else {
                // Tambah data baru ke Firebase (auto generate ID)
                dbRef.push(payload)
                    .then(() => resetForm())
                    .catch(err => alert("Gagal simpan data: " + err.message));
            }
        }

        function editData(id) {
            const item = dataReport.find(i => i.id === id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('inputPeriode').value = item.periode;
            document.getElementById('inputHari').value = item.hari;
            document.getElementById('projVll').value = item.projVll;
            document.getElementById('realVll').value = item.realVll;
            document.getElementById('projRev').value = item.projRev;
            document.getElementById('realRev').value = item.realRev;

            document.getElementById('formTitle').innerText = 'Edit Data Evaluasi VLL';
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = 'Simpan Perubahan';
            submitBtn.className = "w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition duration-200";
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('evalForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('formTitle').innerText = 'Input Data Evaluasi VLL';
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = '+ Tambah Data';
            submitBtn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition duration-200";
            
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        // ----------------------------------------------------
        // 4. HAPUS DATA DARI FIREBASE
        // ----------------------------------------------------
        function deleteData(id) {
            if (confirm("Apakah Anda yakin ingin menghapus baris data ini?")) {
                database.ref('eval_vll_pendapatan/' + id).remove()
                    .then(() => {
                        if (document.getElementById('editId').value == id) {
                            resetForm();
                        }
                    })
                    .catch(err => alert("Gagal menghapus: " + err.message));
            }
        }

        function resetToDefaultData() {
            if (confirm("Apakah Anda yakin ingin menghapus SELURUH data dari database Firebase?")) {
                dbRef.remove()
                    .then(() => resetForm())
                    .catch(err => alert("Gagal menghapus database: " + err.message));
            }
        }

        // ----------------------------------------------------
        // 5. RENDER TABEL
        // ----------------------------------------------------
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let sumProjVll = 0, sumRealVll = 0;
            let sumProjRev = 0, sumRealRev = 0;
            let sumInputHari = 0;

            if (dataReport.length === 0) {
                tbody.innerHTML = `<tr><td colspan="12" class="py-6 text-center text-slate-400">Belum ada data evaluasi.</td></tr>`;
                document.getElementById('tableFoot').innerHTML = '';
                return;
            }

            dataReport.forEach((item) => {
                // Perhitungan VLL
                const capaiVll = item.projVll > 0 ? ((item.realVll / item.projVll) * 100).toFixed(0) : 0;
                const projLhr = item.hari > 0 ? item.projVll / item.hari : 0;
                const realLhr = item.hari > 0 ? item.realVll / item.hari : 0;

                // Perhitungan Pendapatan
                const devRev = item.realRev - item.projRev;
                const capaiRev = item.projRev > 0 ? ((item.realRev / item.projRev) * 100).toFixed(0) : 0;

                sumProjVll += item.projVll;
                sumRealVll += item.realVll;
                sumProjRev += item.projRev;
                sumRealRev += item.realRev;
                sumInputHari += item.hari;

                const devRevClass = devRev >= 0 ? 'text-emerald-600 font-semibold' : 'text-rose-600 font-semibold';
                
                const badgeVllClass = capaiVll >= 100 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800';
                const badgeRevClass = capaiRev >= 100 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800';

                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50 border-b border-slate-100";
                row.innerHTML = `
                    <td class="py-3 px-4 font-semibold text-slate-700 text-left border-r border-slate-100">${item.periode}</td>
                    <td class="py-3 px-4 font-semibold text-slate-700 text-center border-r border-slate-100">${item.hari}</td>
                    
                    <!-- VLL -->
                    <td class="py-3 px-3 text-center">${formatNum(item.projVll)}</td>
                    <td class="py-3 px-3 text-center">${formatNum(projLhr)}</td>
                    <td class="py-3 px-3 text-center font-medium text-blue-600">${formatNum(item.realVll)}</td>
                    <td class="py-3 px-3 text-center font-medium text-blue-600">${formatNum(realLhr)}</td>
                    <td class="py-3 px-3 text-center border-r border-slate-100">
                        <span class="px-2 py-0.5 rounded-full text-xs font-bold ${badgeVllClass}">${capaiVll}%</span>
                    </td>

                    <!-- Pendapatan -->
                    <td class="py-3 px-3 text-center">${formatCurrency(item.projRev)}</td>
                    <td class="py-3 px-3 text-center font-medium text-blue-700">${formatCurrency(item.realRev)}</td>
                    <td class="py-3 px-3 text-center ${devRevClass}">${devRev > 0 ? '+' : ''}${formatNum(devRev)}</td>
                    <td class="py-3 px-3 text-center">
                        <span class="px-2 py-0.5 rounded-full text-xs font-bold ${badgeRevClass}">${capaiRev}%</span>
                    </td>

                    <!-- Aksi -->
                    <td class="py-3 px-3 text-center border-l border-slate-100">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="editData('${item.id}')" title="Edit Baris" class="p-1 text-amber-600 hover:text-amber-800 hover:bg-amber-50 rounded transition">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            </button>
                            <button onclick="deleteData('${item.id}')" title="Hapus Baris" class="p-1 text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded transition">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });

            // Summary Total
            const totalCapaiVll = sumProjVll > 0 ? ((sumRealVll / sumProjVll) * 100).toFixed(0) : 0;
            const totalDevRev = sumRealRev - sumProjRev;
            const totalCapaiRev = sumProjRev > 0 ? ((sumRealRev / sumProjRev) * 100).toFixed(0) : 0;
            const totalProjLhr = sumInputHari > 0 ? sumProjVll / sumInputHari : 0;
            const totalRealLhr = sumInputHari > 0 ? sumRealVll / sumInputHari : 0;

            document.getElementById('tableFoot').innerHTML = `
                <td class="py-3 px-4 text-center border-r border-slate-200">TOTAL</td>
                <td class="py-3 px-3 text-center">${formatNum(sumInputHari)}</td>
                <td class="py-3 px-3 text-center">${formatNum(sumProjVll)}</td>
                <td class="py-3 px-3 text-center">${formatNum(totalProjLhr)}</td>
                <td class="py-3 px-3 text-center text-blue-700">${formatNum(sumRealVll)}</td>
                <td class="py-3 px-3 text-center text-blue-700">${formatNum(totalRealLhr)}</td>
                <td class="py-3 px-3 text-center border-r border-slate-200 text-blue-800">${totalCapaiVll}%</td>
                <td class="py-3 px-3 text-center">${formatCurrency(sumProjRev)}</td>
                <td class="py-3 px-3 text-center text-blue-700">${formatCurrency(sumRealRev)}</td>
                <td class="py-3 px-3 text-center ${totalDevRev >= 0 ? 'text-emerald-700' : 'text-rose-700'}">${totalDevRev > 0 ? '+' : ''}${formatNum(totalDevRev)}</td>
                <td class="py-3 px-3 text-center text-emerald-800">${totalCapaiRev}%</td>
                <td></td>
            `;
        }

        // Export Excel
        function exportToExcel() {
            if (dataReport.length === 0) return alert('Data kosong!');
            
            const exportData = dataReport.map(item => {
                const devVll = item.realVll - item.projVll;
                const capaiVll = item.projVll > 0 ? ((item.realVll / item.projVll) * 100).toFixed(2) + '%' : '0%';
                const devRev = item.realRev - item.projRev;
                const capaiRev = item.projRev > 0 ? ((item.realRev / item.projRev) * 100).toFixed(2) + '%' : '0%';

                return {
                    'Periode': item.periode,
                    'Hari': item.hari,
                    'Proyeksi VLL': item.projVll,
                    'Realisasi VLL': item.realVll,
                    'Deviasi VLL': devVll,
                    '% Capai VLL': capaiVll,
                    'Proyeksi Pendapatan (Rp)': item.projRev,
                    'Realisasi Pendapatan (Rp)': item.realRev,
                    'Deviasi Pendapatan (Rp)': devRev,
                    '% Capai Pendapatan': capaiRev,
                };
            });

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Evaluasi VLL vs Realisasi");
            XLSX.writeFile(wb, `Laporan_Perbandingan_VLL_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>
</html>
